services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reclaude
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d reclaude"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - reclaude-cookies:/var/lib/reclaude-bot/cookies
    restart: unless-stopped
volumes:
  postgres-data:
  reclaude-cookies:
