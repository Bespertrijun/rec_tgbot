services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reclaude
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d reclaude"]
      interval: 5s
      timeout: 5s
      retries: 10

  permissions:
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown -R 10001:10001 /var/lib/reclaude-bot/cookies /var/lib/reclaude-bot/logs &&
        find /var/lib/reclaude-bot/cookies /var/lib/reclaude-bot/logs -type d -exec chmod 700 {} + &&
        find /var/lib/reclaude-bot/cookies /var/lib/reclaude-bot/logs -type f -exec chmod 600 {} +
    volumes:
      - reclaude-cookies:/var/lib/reclaude-bot/cookies
      - reclaude-logs:/var/lib/reclaude-bot/logs
    restart: "no"

  bot:
    build: .
    env_file: .env
    environment:
      RECLAUDE_COOKIE_JAR_PATH: /var/lib/reclaude-bot/cookies/cookies.json
      LOG_FILE_PATH: /var/lib/reclaude-bot/logs/reclaude-bot.log
    depends_on:
      db:
        condition: service_healthy
      permissions:
        condition: service_completed_successfully
    volumes:
      - reclaude-cookies:/var/lib/reclaude-bot/cookies
      - reclaude-logs:/var/lib/reclaude-bot/logs
    restart: unless-stopped
volumes:
  postgres-data:
  reclaude-cookies:
  reclaude-logs:
