name: reclaude-device

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reclaude}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the device .env}
    volumes:
      - ./data-device/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bot} -d $${POSTGRES_DB:-reclaude}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  bot:
    image: ${DEVICE_BOT_IMAGE:-ghcr.io/bespertrijun/rec_tgbot:device-latest}
    env_file:
      - .env
    environment:
      RECLAUDE_COOKIE_JAR_PATH: /var/lib/reclaude-bot/cookies/cookies.json
      LOG_FILE_PATH: /var/lib/reclaude-bot/logs/reclaude-bot.log
      UPDATE_STATE_FILE: /var/lib/reclaude-bot/update/pending.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data-device/cookies:/var/lib/reclaude-bot/cookies
      - ./data-device/logs:/var/lib/reclaude-bot/logs
      - ./data-device/update:/var/lib/reclaude-bot/update
      # The admin-only /update command uses the Docker socket; remove to disable it.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
