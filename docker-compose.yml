services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reclaude}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the server .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bot} -d $${POSTGRES_DB:-reclaude}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  bot:
    image: ${BOT_IMAGE:-ghcr.io/bespertrijun/rec_tgbot:latest}
    env_file:
      - .env
    environment:
      RECLAUDE_COOKIE_JAR_PATH: /var/lib/reclaude-bot/cookies/cookies.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - reclaude-cookies:/var/lib/reclaude-bot/cookies
    restart: unless-stopped

volumes:
  postgres-data:
  reclaude-cookies:
