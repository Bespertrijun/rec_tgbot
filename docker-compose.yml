services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reclaude}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the server .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bot} -d $${POSTGRES_DB:-reclaude}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  permissions:
    image: ${BOT_IMAGE:-ghcr.io/bespertrijun/rec_tgbot:latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown -R 10001:10001 /var/lib/reclaude-bot/cookies /var/lib/reclaude-bot/logs &&
        find /var/lib/reclaude-bot/cookies /var/lib/reclaude-bot/logs -type d -exec chmod 700 {} + &&
        find /var/lib/reclaude-bot/cookies /var/lib/reclaude-bot/logs -type f -exec chmod 600 {} +
    volumes:
      - ./data/cookies:/var/lib/reclaude-bot/cookies
      - ./data/logs:/var/lib/reclaude-bot/logs
    restart: "no"

  bot:
    image: ${BOT_IMAGE:-ghcr.io/bespertrijun/rec_tgbot:latest}
    env_file:
      - .env
    environment:
      RECLAUDE_COOKIE_JAR_PATH: /var/lib/reclaude-bot/cookies/cookies.json
      LOG_FILE_PATH: /var/lib/reclaude-bot/logs/reclaude-bot.log
    depends_on:
      db:
        condition: service_healthy
      permissions:
        condition: service_completed_successfully
    volumes:
      - ./data/cookies:/var/lib/reclaude-bot/cookies
      - ./data/logs:/var/lib/reclaude-bot/logs
    restart: unless-stopped
