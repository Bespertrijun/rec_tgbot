[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaude-quota-bot"
version = "0.1.0"
description = "Telegram bot for controlled Reclaude account allocation"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24,<27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "aiosqlite>=0.20,<1",
]

[project.scripts]
reclaude-bot = "reclaude_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
strict = false
